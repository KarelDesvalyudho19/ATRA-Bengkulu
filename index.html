<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATRA-Bengkulu — Advanced Try-On &amp; Reality-Adat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#1E2A78; --gold:#D4A72C; --beige:#F4EBDD; --brown:#4A3025;
  --bg:#FFFFFF; --bg-2:#FAF6EE; --band:#F4EBDD;
  --ink:#4A3025; --ink-2:#7A6355; --head:#1E2A78; --line:rgba(74,48,37,.16);
  --btn:#1E2A78; --btn-ink:#FFFFFF; --glass:rgba(255,255,255,.74);
  --motif:#1E2A78; --motif-o:.07;
  --shadow:0 24px 50px -26px rgba(30,42,120,.45);
  --ok:#1E6B4A; --wait:#9A6B00; --rev:#A33A2B;
  --sans:'Plus Jakarta Sans','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1130; --bg-2:#131947; --band:#161D50; --ink:#EFE6D6; --ink-2:#B9AF9D; --head:#F4EBDD; --line:rgba(244,235,221,.16);
    --btn:#D4A72C; --btn-ink:#1B1400; --glass:rgba(19,25,71,.74); --motif:#D4A72C; --motif-o:.09;
    --shadow:0 24px 50px -26px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1130; --bg-2:#131947; --band:#161D50; --ink:#EFE6D6; --ink-2:#B9AF9D; --head:#F4EBDD; --line:rgba(244,235,221,.16);
  --btn:#D4A72C; --btn-ink:#1B1400; --glass:rgba(19,25,71,.74); --motif:#D4A72C; --motif-o:.09;
  --shadow:0 24px 50px -26px rgba(0,0,0,.75);
}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;min-height:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
.ic{display:inline-block;vertical-align:middle;flex:none}
h1,h2,h3{color:var(--head);line-height:1.1;font-weight:700}
h2.display{font-family:var(--serif);font-size:clamp(1.9rem,4.4vw,3rem);letter-spacing:-.01em;font-weight:700}
.muted{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* splash */
#splash{position:fixed;inset:0;z-index:100;background:#141B58;display:grid;place-items:center;color:#F4EBDD;transition:opacity .5s ease,visibility .5s}
#splash.off{opacity:0;visibility:hidden}
#splash .in{display:grid;justify-items:center;gap:18px;text-align:center}
#splash svg path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}
#splash svg path:nth-child(2){animation-delay:.35s}
#splash .nm{font-family:var(--serif);font-size:1.7rem;font-weight:700;letter-spacing:.01em}
#splash .ld{width:150px;height:3px;border-radius:3px;background:rgba(244,235,221,.2);overflow:hidden}
#splash .ld i{display:block;height:100%;width:100%;background:var(--gold);transform:translateX(-100%);animation:load 1.2s ease forwards}
#splash small{font-size:.8rem;opacity:.75}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes load{to{transform:none}}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:40;padding-top:env(safe-area-inset-top,0px);background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid var(--line)}
.nav .wrap{height:64px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-weight:800;font-size:1.2rem;color:var(--head);white-space:nowrap}
.brand .mk{width:34px;height:34px;border-radius:50%;background:var(--indigo);display:grid;place-items:center;color:var(--gold)}
.links{display:flex;gap:2px;margin-left:auto;align-items:center}
.links a{font-size:.86rem;font-weight:600;text-decoration:none;padding:8px 12px;border-radius:999px;color:var(--ink);transition:background .2s,color .2s}
.links a:hover{background:rgba(212,167,44,.18)}
.links a[aria-current="page"]{background:var(--btn);color:var(--btn-ink)}
.nav-tools{display:flex;align-items:center;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:background .2s}
.icon-btn:hover{background:rgba(212,167,44,.2)}
.burger{display:none}
main{padding-top:64px;min-height:70vh}
.tabbar{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:700;font-size:.95rem;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s;border:1.5px solid transparent;line-height:1.2}
.btn.primary{background:var(--btn);color:var(--btn-ink);box-shadow:0 10px 24px -12px var(--btn)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 16px 28px -14px var(--btn)}
.btn.ghost{border-color:var(--head);color:var(--head)}
.btn.ghost:hover{background:rgba(212,167,44,.16)}
.btn.gold{background:var(--gold);color:#2A1D00}
.btn.gold:hover{transform:translateY(-2px)}
.btn.sm{padding:9px 15px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ok{background:#DDF0E4;color:#17583B}.pill.wait{background:#FBEDC2;color:#7A5300}.pill.rev{background:#F7D9D3;color:#8A2D20}
.pill svg path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s .1s ease forwards}

/* motif background */
.motif-bg{position:absolute;inset:0;width:100%;height:100%;color:var(--motif);opacity:var(--motif-o);pointer-events:none}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--bg-2),var(--bg));padding:56px 0 84px}
.hero-grid{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.hero h1{font-family:var(--serif);font-weight:800;font-size:clamp(2.3rem,5.7vw,5rem);letter-spacing:-.025em;line-height:1;color:var(--head);white-space:nowrap}
.acro{margin-top:14px;font-size:.92rem;font-weight:600;color:var(--ink-2)}
.sub{margin-top:22px;font-size:clamp(1.15rem,2.4vw,1.5rem);font-weight:600;line-height:1.35;max-width:22em;color:var(--ink)}
.lede{margin-top:14px;max-width:34em;color:var(--ink-2)}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero-foot{margin-top:18px;font-size:.82rem;color:var(--ink-2)}
.hero-visual{position:relative;min-height:520px;display:grid;place-items:center}

/* AR device / stage */
.stage{position:relative;aspect-ratio:4/5;width:100%;border-radius:26px;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,#2F3A8C 0%,#1A2166 45%,#231715 100%);box-shadow:var(--shadow);isolation:isolate}
.device{width:min(350px,80%);border:6px solid #0f1440;border-radius:32px;box-shadow:0 30px 60px -28px rgba(30,42,120,.7);transform:rotate(2.5deg)}
.stage .figure{position:absolute;inset:0;width:100%;height:100%}
.stage .grain{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none;z-index:2}
.brk{position:absolute;width:26px;height:26px;border:2.5px solid var(--gold);z-index:3}
.brk.a{top:14px;left:14px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.brk.b{top:14px;right:14px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.brk.c{bottom:14px;left:14px;border-right:0;border-top:0;border-radius:0 0 0 8px}
.brk.d{bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.scanline{position:absolute;left:6%;right:6%;height:3px;top:0;z-index:4;border-radius:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 22px 6px rgba(212,167,44,.5);opacity:0}
.stage-chip{position:absolute;z-index:5;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:.72rem;font-weight:700;background:rgba(13,17,48,.62);backdrop-filter:blur(8px);color:#F4EBDD;border:1px solid rgba(244,235,221,.2)}
.stage-chip.tl{top:16px;left:50px}.stage-chip.bl{bottom:64px;left:50%;transform:translateX(-50%)}
.stage-chip .dot{width:7px;height:7px;border-radius:50%;background:#5BD08C}
.sun-wrap{position:absolute;left:13%;width:74%;top:2.7%;z-index:3;transform-origin:50% 88%;transform:perspective(800px) rotateY(var(--yaw,0deg));transition:transform .35s cubic-bezier(.3,.7,.3,1)}
.sun-wrap svg{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.mesh circle{fill:var(--gold);opacity:0}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes reveal{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes sweep{0%{top:4%;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:96%;opacity:0}}
@keyframes blink{0%{opacity:0}40%{opacity:1}100%{opacity:.55}}
@keyframes fadeout{to{opacity:0}}
body.go .hero .scanline{animation:sweep 1.9s ease-in-out .5s 1 both}
body.go .hero .sun-wrap{animation:reveal .9s cubic-bezier(.2,.8,.3,1) 2.2s both}
body.go .hero .mesh circle{animation:blink .5s ease calc(var(--i)*22ms + .5s) both}
body.go .hero .mesh{animation:fadeout .6s ease 2.2s forwards}
.hero .float-card{position:absolute;left:-26px;bottom:-6px;width:min(236px,56%);transform:rotate(-4deg);z-index:6;transition:transform .3s}
.hero .float-card:hover{transform:rotate(-1.5deg) translateY(-6px)}
.hero .float-card.two{left:auto;right:-8px;top:56px;bottom:auto;transform:rotate(5deg);width:min(196px,46%)}
.hero .float-card.two:hover{transform:rotate(2deg) translateY(-6px)}

/* provenance card */
.pcard{position:relative;color:#3A261D;background:linear-gradient(#FAF3E4,#F2E7D2);border-radius:6px;border:1px solid rgba(74,48,37,.2);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 26px 44px -22px rgba(30,42,120,.55),0 3px 8px rgba(74,48,37,.16);overflow:hidden;text-align:left}
.pcard::after{content:"";position:absolute;inset:7px;border:1px solid rgba(212,167,44,.85);border-radius:3px;pointer-events:none}
.pc-head{background:#1E2A78;color:#F4EBDD;padding:16px 20px 15px;position:relative}
.pc-head::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 92% 20%,rgba(212,167,44,.35),transparent 46%)}
.pc-ref{position:relative;display:block;font-size:.7rem;font-weight:600;opacity:.8;letter-spacing:.04em}
.pc-kind{position:relative;display:block;font-size:.72rem;color:#E8C766;font-weight:700;margin-top:1px}
.pc-head h3{position:relative;font-family:var(--serif);font-size:1.7rem;color:#fff;margin-top:8px;font-weight:700}
.pc-body{padding:14px 20px 8px;display:grid;gap:10px}
.pc-body dt{font-size:.72rem;font-weight:700;color:#8B6B57}
.pc-body dd{font-size:.92rem;line-height:1.45;color:#3A261D}
.pc-body .full{padding:12px 14px;border-radius:4px;background:rgba(212,167,44,.16);border-left:3px solid #D4A72C}
.pc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 20px 0;padding:12px 0 16px;border-top:1.5px dashed rgba(74,48,37,.3);min-height:92px}
.pc-foot .seal{margin-top:-34px;margin-right:2px}
.pcard.mini .pc-head{padding:11px 15px 11px}.pcard.mini .pc-head h3{font-size:1.3rem;margin-top:4px}
.pcard.mini .pc-body{padding:10px 15px 4px;gap:6px}.pcard.mini .pc-body dd{font-size:.8rem}
.pcard.mini .pc-foot{margin:6px 15px 0;padding:8px 0 10px;min-height:64px}.pcard.mini .pc-foot .seal{width:58px;height:58px;margin-top:-22px}
.pcard.mini::after{inset:5px}
.seal{transform:rotate(-9deg);mix-blend-mode:multiply;flex:none}
.seal.stamp{animation:stamp .7s cubic-bezier(.2,1.5,.4,1) both}
body.go .hero .seal.stamp{animation-delay:3.1s}
@keyframes stamp{0%{transform:rotate(-30deg) scale(2.4);opacity:0}55%{opacity:1}100%{transform:rotate(-9deg) scale(1);opacity:1}}
.seal .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s .45s ease forwards}
.hero .float-card.two .seal.stamp{animation-delay:3.4s}

/* sections */
.sec{padding:84px 0;position:relative}
.sec.band{background:var(--band)}
.why{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px}
.why .head p{margin-top:16px;max-width:26em;color:var(--ink-2)}
.val{display:grid;grid-template-columns:64px 1fr;gap:18px;padding:26px 0;border-top:1px solid var(--line)}
.val:last-child{border-bottom:1px solid var(--line)}
.val .vi{width:52px;height:52px;border-radius:50%;background:var(--indigo);color:var(--gold);display:grid;place-items:center}
.val h3{font-family:var(--serif);font-size:1.7rem}
.val p{margin-top:6px;font-size:1.05rem}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:44px;position:relative}
.flow::before{content:"";position:absolute;left:8%;right:8%;top:22px;border-top:2px dashed var(--gold)}
.step{position:relative;text-align:center;padding:0 14px}
.step .n{width:46px;height:46px;margin:0 auto 14px;border-radius:50%;background:var(--bg);border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--head);font-size:1.15rem}
.step h3{font-size:1.05rem;font-family:var(--sans)}
.step p{margin-top:6px;font-size:.92rem;color:var(--ink-2)}
.cta-band{background:var(--indigo);color:#F4EBDD;border-radius:28px;padding:54px 44px;position:relative;overflow:hidden;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.cta-band h2{color:#fff;font-family:var(--serif);font-size:clamp(1.7rem,3.6vw,2.5rem);max-width:16em}
.cta-band .motif-bg{color:#D4A72C;opacity:.12}
.foot{padding:36px 0 60px;border-top:1px solid var(--line);font-size:.86rem;color:var(--ink-2)}
.foot .wrap{display:flex;flex-wrap:wrap;gap:12px 30px;justify-content:space-between}

/* app pages */
.page{padding:44px 0 90px}
.page-head{margin-bottom:30px}
.page-head h1{font-family:var(--serif);font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.01em}
.page-head p{margin-top:10px;max-width:40em;color:var(--ink-2)}
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.tile{position:relative;overflow:hidden;border-radius:24px;padding:28px;min-height:260px;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;transition:transform .3s,box-shadow .3s;isolation:isolate}
.tile:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.tile h3{font-size:1.65rem;font-family:var(--serif);color:inherit}
.tile p{margin-top:6px;font-size:.95rem;max-width:22em;opacity:.9}
.tile .go-lbl{margin-top:16px;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem}
.t1{grid-column:span 7;background:linear-gradient(160deg,#1E2A78,#141B58);color:#F4EBDD}
.t2{grid-column:span 5;background:#4A3025;color:#F4EBDD}
.t3{grid-column:span 5;background:var(--band);color:var(--ink)}
.t3 h3,.t4 h3{color:var(--head)}
.t4{grid-column:span 7;background:var(--bg-2);border:1px solid var(--line);color:var(--ink)}
.tile .art{position:absolute;z-index:-2;pointer-events:none}
.t1 .art{right:-10px;top:-6px;width:52%;opacity:.98}
.t2 .art{inset:0;width:100%;height:100%;opacity:.55}
.t2::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,#4A3025 30%,rgba(74,48,37,.55) 75%,rgba(74,48,37,.25))}
.stat-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.badge-lim{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:700;padding:6px 12px;border-radius:999px;background:rgba(212,167,44,.22);color:var(--head);border:1px solid rgba(212,167,44,.6)}
.recent{margin-top:44px}
.recent h2{font-size:1.25rem;margin-bottom:14px}
.recent-row .rc{flex:none;width:250px}.recent-row{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 18px;scroll-snap-type:x proximity}
.rc{flex:none;width:250px;scroll-snap-align:start;text-align:left}

/* AR page */
.ar{display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:44px;align-items:start}
.ctrl{position:absolute;left:0;right:0;bottom:14px;z-index:6;display:flex;justify-content:center;gap:8px}
.cbtn{width:46px;height:46px;border-radius:50%;background:rgba(13,17,48,.62);backdrop-filter:blur(10px);border:1px solid rgba(244,235,221,.25);color:#F4EBDD;display:grid;place-items:center;transition:background .2s,transform .2s}
.cbtn:hover{background:rgba(212,167,44,.85);color:#1B1400;transform:translateY(-2px)}
.cbtn[aria-pressed="true"]{background:var(--gold);color:#1B1400}
.overlay{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:26px;background:rgba(13,17,48,.78);backdrop-filter:blur(6px);text-align:center;color:#F4EBDD}
.overlay h3{font-family:var(--serif);color:#fff;font-size:1.5rem}
.overlay p{font-size:.9rem;margin-top:8px;opacity:.9}
.overlay .btns{display:grid;gap:10px;margin-top:20px}
.ar-side h1{font-family:var(--serif);font-size:clamp(1.9rem,4vw,2.7rem)}
.slider{display:flex;align-items:center;gap:12px;margin-top:22px;font-size:.85rem;font-weight:600}
.slider input{flex:1;accent-color:var(--gold)}
.panel{margin-top:22px;border-radius:20px;background:var(--bg-2);border:1px solid var(--line);padding:22px 24px}
.panel h3{font-size:1.02rem;font-family:var(--sans);margin-bottom:6px}
.panel p+h3{margin-top:14px}
.panel p{font-size:.94rem}
.note-honest{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:rgba(212,167,44,.16);border:1px solid rgba(212,167,44,.5);font-size:.9rem;margin-top:20px;color:var(--ink)}

/* Besurek */
.bs{display:grid;grid-template-columns:minmax(0,520px) 1fr;gap:44px;align-items:start}
.view-f{position:relative;aspect-ratio:4/3;border-radius:24px;overflow:hidden;background:#111;box-shadow:var(--shadow);isolation:isolate}
.view-f .fab{position:absolute;inset:0;width:100%;height:100%}.view-f .fab svg{width:100%;height:100%;display:block}.result{margin-top:28px}
.view-f .dim{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 42%,rgba(0,0,0,.5));z-index:1}
.reticle{position:absolute;left:19%;right:19%;top:16%;bottom:16%;z-index:3;border-radius:12px}
.reticle i{position:absolute;width:30px;height:30px;border:3px solid var(--gold)}
.reticle i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.reticle i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.reticle i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.reticle i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.view-f.scanning .reticle{animation:pulse .9s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(.965)}}
.gridscan{position:absolute;inset:16% 19%;z-index:2;opacity:0;background:linear-gradient(rgba(212,167,44,.35) 1px,transparent 1px) 0 0/100% 16px,linear-gradient(90deg,rgba(212,167,44,.35) 1px,transparent 1px) 0 0/16px 100%}
.view-f.scanning .gridscan{opacity:1}
.view-f.scanning .scanline{left:19%;right:19%;animation:sweep 1.1s ease-in-out infinite}

.samples{display:flex;gap:12px;margin-top:16px}
.sample{flex:1;border-radius:14px;overflow:hidden;border:2px solid transparent;text-align:left;background:var(--bg-2);transition:border-color .2s,transform .2s}

.result h2{font-family:var(--serif);font-size:clamp(1.8rem,3.6vw,2.6rem)}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.wave{display:flex;gap:3px;align-items:center;height:26px;margin-left:4px}
.wave i{width:3px;height:6px;background:currentColor;border-radius:2px}

.transcript{margin-top:14px;padding:16px 18px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line);font-size:.95rem}
.transcript b{display:block;font-size:.78rem;color:var(--ink-2);margin-bottom:4px}
.manual{margin-top:18px;font-size:.88rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=text]{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.empty{padding:34px 28px;border:2px dashed var(--line);border-radius:22px}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.chip{padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:.86rem;transition:all .2s}

.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:26px;align-items:start}
.cardbtn{text-align:left;display:block;width:100%;transition:transform .3s}
.cardbtn:hover{transform:translateY(-6px) rotate(-.6deg)}
.cardbtn:nth-child(2n):hover{transform:translateY(-6px) rotate(.6deg)}
.thumbwrap .thumb{height:64px;position:relative;border-radius:6px 6px 0 0;overflow:hidden;border:1px solid rgba(74,48,37,.2);border-bottom:0}.thumb svg{position:absolute;inset:0;width:100%;height:100%}.thumbwrap .pcard{border-radius:0 0 6px 6px}

/* chat */
.chat{display:grid;grid-template-columns:1fr 320px;gap:30px;align-items:start}
.chat-box{border:1px solid var(--line);border-radius:24px;background:var(--bg-2);display:flex;flex-direction:column;height:min(680px,calc(100vh - 180px));min-height:520px;overflow:hidden}
.chat-top{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--bg)}
.chat-top .av{width:42px;height:42px;border-radius:50%;background:var(--indigo);color:var(--gold);display:grid;place-items:center}
.chat-top h1{font-size:1.1rem;font-family:var(--sans)}
.msgs{flex:1;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:84%;padding:13px 16px;border-radius:18px;font-size:.95rem;line-height:1.55}
.msg.user{align-self:flex-end;background:var(--btn);color:var(--btn-ink);border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.ai.miss{border-color:rgba(163,58,43,.5)}
.src{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:6px 11px;border-radius:999px;background:rgba(212,167,44,.2);font-size:.78rem;font-weight:700;color:var(--head);border:1px solid rgba(212,167,44,.55)}

.typing{display:inline-flex;gap:4px;padding:4px 0}.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-2);animation:tp .9s infinite ease-in-out}

@keyframes tp{0%,80%,100%{opacity:.3;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.sugg{padding:0 20px 10px;display:flex;flex-wrap:wrap;gap:8px}
.sugg .chip{font-size:.8rem;padding:6px 12px;background:var(--bg)}
.composer{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line);background:var(--bg)}
.composer input{flex:1;border-radius:999px;padding:12px 18px}
.composer .btn{padding:0 18px}
.rules{display:grid;gap:12px}
.rule{display:flex;gap:12px;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--bg-2);font-size:.9rem}
.rule .ic{color:var(--gold);margin-top:2px}

/* curator */
.rev-list{display:grid;gap:14px}

.row h3{font-family:var(--serif);font-size:1.3rem}
.row .sub2{font-size:.85rem;color:var(--ink-2);margin-top:2px}
.row .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

.about{display:grid;grid-template-columns:1fr 1fr;gap:56px}

.member{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--bg-2);border:1px solid var(--line)}
.member .av{width:42px;height:42px;border-radius:50%;background:var(--indigo);color:#F4EBDD;display:grid;place-items:center;font-weight:800;font-family:var(--serif)}
.member b{display:block;font-size:.98rem}.member span{font-size:.82rem;color:var(--ink-2)}

.login{max-width:460px;margin:0 auto;padding:60px 0 100px}
.login h1{font-family:var(--serif);font-size:2.4rem}
.field{margin-top:22px;display:grid;gap:6px;font-weight:600;font-size:.88rem}

/* ============ svg builders ============ */
function sealSVG(status,size=76,stamp=true){
  const s=STATUS[status],u=uid();
  return `<svg class="seal ${stamp?'stamp':''}" viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="${s.label}">
   <defs><path id="sp${u}" d="M50 50m-36 0a36 36 0 1 1 72 0a36 36 0 1 1-72 0"/></defs>
   <circle cx="50" cy="50" r="47" fill="none" stroke="${s.col}" stroke-width="2.6"/>
   <circle cx="50" cy="50" r="27" fill="none" stroke="${s.col}" stroke-width="1.2"/>
   <text font-family="Plus Jakarta Sans,sans-serif" font-size="8.4" font-weight="800" letter-spacing="1" fill="${s.col}"><textPath href="#sp${u}">${s.ring}</textPath></text>
   <g transform="translate(31 31) scale(1.58)" fill="none" stroke="${s.col}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" pathLength="1" d="${s.d}"/></g>
  </svg>`;
}
function pill(status){const s=STATUS[status];return `<span class="pill ${s.cls}">${ic(s.icon,14)}${s.label}</span>`}

function suntiangSVG(){
  let o=`<svg viewBox="0 0 340 230" aria-hidden="true">`;
  const cx=170,by=206,rad=Math.PI/180;
  // baris luar
  for(let i=0;i<=16;i++){
    const a=(-80+i*10)*rad, len=126-Math.abs(-80+i*10)*0.34+(i%2?0:14);
    const x=cx+Math.sin(a)*len*1.35, y=by-Math.cos(a)*len*.72;
    o+=`<path d="M${cx} ${by}Q${(cx+x)/2} ${(by+y)/2-10} ${x} ${y}" stroke="url(#gline)" stroke-width="1.8" fill="none"/>`;
    const r=i%2?7.5:10.5;
    o+=flower(x,y,r);
    if(i%3===0){o+=`<g class="sway" style="animation-delay:${(i*.17).toFixed(2)}s"><path d="M${x} ${y+r*.6}v22" stroke="url(#gline)" stroke-width="1"/><circle cx="${x}" cy="${y+26}" r="3.6" fill="url(#gg)"/></g>`}
  }
  // baris dalam
  for(let i=0;i<=8;i++){
    const a=(-64+i*16)*rad,len=74+(i%2?0:10);
    const x=cx+Math.sin(a)*len*1.25,y=by-Math.cos(a)*len*.78;
    o+=`<path d="M${cx} ${by}L${x} ${y}" stroke="url(#gline)" stroke-width="1.5"/>`+flower(x,y,i%2?8:6);
  }
  // dasar dan bunga tengah
  o+=`<ellipse cx="${cx}" cy="${by+3}" rx="62" ry="12" fill="url(#gg)"/><ellipse cx="${cx}" cy="${by}" rx="56" ry="7" fill="none" stroke="#7B5A10" stroke-width="1" opacity=".5"/>`;
  o+=flower(cx,150,21)+`</svg>`;
  return o;
}
function flower(x,y,r){
  let f=`<g>`;
  for(let k=0;k<5;k++){const a=k*72*Math.PI/180;f+=`<circle cx="${(x+Math.sin(a)*r*.62).toFixed(1)}" cy="${(y-Math.cos(a)*r*.62).toFixed(1)}" r="${(r*.5).toFixed(1)}" fill="url(#gg)" stroke="#7B5A10" stroke-width=".5"/>`}
  return f+`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r*.36).toFixed(1)}" fill="#F6DE8A" stroke="#7B5A10" stroke-width=".5"/></g>`;
}
function figureSVG(mesh){
  let m='';
  if(mesh){
    let i=0;
    for(const [k,sc] of [[36,1],[28,.68],[18,.36]]){
      for(let j=0;j<k;j++){const a=j/k*Math.PI*2;m+=`<circle style="--i:${i++}" cx="${(150+Math.cos(a)*58*sc).toFixed(1)}" cy="${(215+Math.sin(a)*74*sc).toFixed(1)}" r="1.9"/>`}
    }
    for(let y=160;y<=270;y+=22){for(let x=118;x<=182;x+=16){m+=`<circle style="--i:${i++}" cx="${x}" cy="${y}" r="1.4"/>`}}
  }
  return `<svg class="figure" viewBox="0 0 300 380" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path d="M0 380C0 322 58 302 112 294h76c54 8 112 28 112 86z" fill="rgba(244,235,221,.17)"/>
    <rect x="128" y="255" width="44" height="52" rx="17" fill="rgba(244,235,221,.2)"/>
    <ellipse cx="150" cy="215" rx="58" ry="74" fill="rgba(244,235,221,.24)"/>
    <ellipse cx="150" cy="215" rx="62" ry="78" fill="none" stroke="rgba(212,167,44,.55)" stroke-width="1.2" stroke-dasharray="4 5"/>
    <g class="mesh">${m}</g></svg>`;
}
function swatch(kind){
  const u=uid(),id=`sw${u}`;
  const cfg={
    kaligrafi:{bg:'#1E2A78',ink:'#E8C766',alt:'#F4EBDD'},
    motifa:{bg:'#4A3025',ink:'#F4EBDD',alt:'#D4A72C'},
    rafflesia:{bg:'#7B2A32',ink:'#F1D27A',alt:'#F4EBDD'},
    suntiang:{bg:'#1E2A78',ink:'#E8C766',alt:'#F4EBDD'}
  }[kind]||{bg:'#1E2A78',ink:'#E8C766',alt:'#F4EBDD'};
  let tile='';
  if(kind==='kaligrafi'||kind==='suntiang'){
    tile=`<path d="M0 22c8-14 14 14 22 0s14-14 22 0" fill="none" stroke="${cfg.ink}" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M6 44c6-8 10 6 16-2M28 46c4-10 12 4 16-4" fill="none" stroke="${cfg.alt}" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="30" cy="8" r="3.4" fill="${cfg.alt}"/><circle cx="8" cy="34" r="2.4" fill="${cfg.ink}"/><circle cx="40" cy="36" r="2.4" fill="${cfg.ink}"/>`;
  }else if(kind==='motifa'){
    tile=`<path d="M0 20c8-12 14 12 22 0s14-12 22 0" fill="none" stroke="${cfg.ink}" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M22 30l8 8-8 8-8-8z" fill="${cfg.alt}"/><path d="M4 42c4-6 8-6 10 0M34 8c4-6 8-6 10 0" stroke="${cfg.ink}" fill="none" stroke-width="1.6"/>`;
  }else{
    let p='';for(let k=0;k<5;k++)p+=`<ellipse cx="22" cy="12" rx="5.5" ry="10" fill="${cfg.ink}" transform="rotate(${k*72} 22 22)"/>`;
    tile=p+`<circle cx="22" cy="22" r="4" fill="${cfg.bg}"/><circle cx="4" cy="4" r="2" fill="${cfg.alt}"/><circle cx="40" cy="40" r="2" fill="${cfg.alt}"/>`;
  }
  return `<svg preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><pattern id="${id}" width="44" height="52" patternUnits="userSpaceOnUse">${tile}</pattern></defs><rect width="100%" height="100%" fill="${cfg.bg}"/><rect width="100%" height="100%" fill="url(#${id})"/></svg>`;
}

const arInit=()=>{

function arSetYaw(v){
  ar.yaw=Math.max(-65,Math.min(65,v));
  const s=$('#arsun'),r=$('#yaw'),l=$('#yawv');
  if(s)s.style.setProperty('--yaw',ar.yaw+'deg');
  if(r)r.value=ar.yaw;if(l)l.textContent=Math.round(ar.yaw)+'°';
}
function arStart(cam){
  ar.noCam=!cam;ar.stage='scan';
  const over=$('#arover'),scan=$('#arscan'),stg=$('#arstage'),chip=$('#archip');
  over.style.display='none';
  chip.innerHTML=`<span class="dot" style="background:${cam?'#5BD08C':'#E8C766'}"></span>${cam?'Kamera contoh aktif':'Mode tanpa kamera'}`;
  $$('.mesh circle',stg).forEach((c,i)=>{c.style.animation=`blink .5s ease ${i*22}ms both`});
  scan.style.animation='sweep 1.8s ease-in-out 1 both';
  const hint=document.createElement('span');hint.className='stage-chip bl';hint.id='arhint';hint.textContent='Memetakan titik wajah...';stg.appendChild(hint);
  ar.timer=setTimeout(()=>{
    hint.remove();
    $$('.mesh',stg).forEach(m=>{m.style.transition='opacity .6s';m.style.opacity=0});
    const sun=$('#arsun');sun.style.animation='reveal .8s cubic-bezier(.2,.8,.3,1) both';sun.style.opacity=1;
    $('#arlabel').style.opacity=1;$('#arctrl').style.display='flex';ar.stage='live';
    toast('Suntiang terpasang. Coba putar modelnya.');
  },2000);
}
function arAutoTick(t){
  if(!ar.auto)return;
  if(!ar.t0)ar.t0=t;

  ar.raf=requestAnimationFrame(arAutoTick);
}

const MISS='Informasi tersebut belum tersedia dalam katalog terverifikasi.';
function answer(q){
  const t=q.toLowerCase(),has=(...w)=>w.some(x=>t.includes(x));
  if(has('harga','beli','jual','toko','murah','mahal','cuaca','resep'))return {t:MISS+' Kamu bisa menanyakannya langsung ke perajin, atau mengajukan pertanyaan ini ke kurator.',miss:true};
  let c=null;
  if(has('suntiang','minang'))c=cardBy('suntiang');
  else if(has('rafflesia'))c=cardBy('rafflesia');
  else if(has('motif a','motifa'))c=cardBy('motifa');
  else if(has('kaligrafi'))c=cardBy('kaligrafi');
  else if(has('besurek','batik','motif','kain'))c=cardBy(state.lastMotif);
  if(!c)return {t:MISS+' Coba tanyakan tentang Suntiang atau motif Besurek yang ada di koleksi.',miss:true};
  if(c.status!=='verified'){
    return {t:`${MISS} Kartu ${c.name} berstatus ${STATUS[c.status].label.toLowerCase()}, jadi belum bisa saya jadikan rujukan. ${c.status==='revision'?'Catatan kurator: '+c.revisionNote:'Kartunya masih menunggu penelaah.'}`,miss:true,src:c};
  }
  let body;
  if(has('siapa','penelaah','kurator','telaah','kapan'))body=`Kartu ${c.name} ditelaah oleh ${c.reviewer} pada ${c.date}.`;
  else if(has('asli','asal','dari mana','bengkulu'))body=`${c.name} berasal dari ${c.origin}. ${c.note}`;
  else if(has('sejarah','riwayat'))body=c.history;
  else body=`Motif ini, ${c.name}, memiliki konteks berikut. ${c.meaning} ${c.history} ${c.note}`;
  return {t:`Menurut katalog budaya terverifikasi ATRA-Bengkulu, ${body}`,src:c};
}

  q=(q||'').trim();if(!q)return;

}

/* ============ router ============ */
const GUARDED=['app','suntiang','besurek','asisten','kurator'];
function stopAll(){clearTimeout(ar.timer);ar.auto=false;cancelAnimationFrame(ar.raf);stopAudio(true);clearTimeout(bs.timer)}
function route(){
  stopAll();
  let r=(location.hash.replace(/^#\/?/,'')||'').split('?')[0];
  if(!(r in pages))r='';
  if(GUARDED.includes(r)&&!state.user){location.hash='#/masuk';return}
  if(r==='masuk'&&state.user){location.hash='#/app';return}
  renderNav(r);
  $('#view').innerHTML=pages[r]();
  window.scrollTo(0,0);
  if(r==='suntiang')arInit();
  if(r==='besurek'){bs.stage='idle';bs.playing=false}
  if(r==='asisten'){
    if(!state.chat.length){const a=answer('Apa arti motif Besurek ini?');a.role='ai';state.chat=[{role:'user',t:'Apa arti motif Besurek ini?'},a];$('#msgs').innerHTML=state.chat.map(msgHTML).join('')}
    if(state.prefill){$('#cin').value=state.prefill;state.prefill=''}
    const b=$('#msgs');b.scrollTop=b.scrollHeight;
    $('#cin').addEventListener('keydown',e=>{if(e.key==='Enter'){sendChat(e.target.value);e.target.value=''}});
  }
}
window.addEventListener('hashchange',route);

/* audio */
function stopAudio(silent){
  bs.playing=false;clearInterval(bs.pt);
  try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  if(!silent&&$('#view')&&location.hash.includes('besurek'))refreshBs();
}
function refreshBs(){$('#view').innerHTML=pages['besurek']()}
function playAudio(){
  const m=cardBy(bs.motif);const text=NARASI[m.slug]||m.meaning;
  bs.playing=true;refreshBs();
  try{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(text);u.lang='id-ID';u.rate=.95;u.onend=()=>{if(bs.playing)stopAudio()};speechSynthesis.cancel();speechSynthesis.speak(u)}}catch(e){}
  const dur=Math.max(9000,text.length*62);let t=0;
  bs.pt=setInterval(()=>{t+=100;const p=$('#bprog');if(p)p.style.width=Math.min(100,t/dur*100)+'%';if(t>=dur)stopAudio()},100);
}

  menu(){
    const items=state.user?ROUTES_APP:[...ROUTES_PUB,['#/masuk','Masuk','user']];
    openModal(`<div class="sheet-menu">${items.map(([h,l,i])=>`<a href="${h}" data-act="closeModal">${ic(i||'home',20)}${l}</a>`).join('')}</div>`,'sheet');
  },
  openCard(el){
    const c=cardBy(el.dataset.id);if(!c)return;
    openModal(`${cardHTML(c)}<div class="modal-actions"><button class="btn gold sm" data-act="askAI" data-id="${c.id}">${ic('chat',16)}Tanya AI Guide</button><button class="btn ghost sm" style="color:#F4EBDD;border-color:#F4EBDD" data-act="closeModal">Tutup</button></div>`);
  },
  askAI(el){
    const c=cardBy(el.dataset.id);state.prefill=`Apa arti ${c.name}?`;closeModal();
    if(!state.user){toast('Masuk dulu untuk memakai AI Guide.');location.hash='#/masuk';return}
    location.hash='#/asisten';
  },
  closeModal(){closeModal()},
  bgClose(el,e){if(e.target===el)closeModal()},
  role(el){$$('.role').forEach(b=>b.setAttribute('aria-pressed',b===el))},
  login(){
    const name=($('#lname').value||'').trim()||'Tamu';
    const role=$('.role[aria-pressed="true"]').dataset.role;
    state.user={name,role};location.hash=role==='kurator'?'#/kurator':'#/app';
  },
  logout(){state.user=null;state.chat=[];location.hash='#/'; route()},
  arStart(el){arStart(el.dataset.cam==='1')},
  arRot(el){if(ar.stage!=='live')return;ar.auto=false;const b=$('[data-act="arAuto"]');b&&b.setAttribute('aria-pressed','false');arSetYaw(ar.yaw+Number(el.dataset.d))},
  arAuto(el){ar.auto=!ar.auto;el.setAttribute('aria-pressed',ar.auto);if(ar.auto){ar.t0=0;ar.raf=requestAnimationFrame(arAutoTick)}},
  arInfo(el){ar.info=!ar.info;el.setAttribute('aria-pressed',ar.info);const p=$('#arinfo');p.hidden=!ar.info;if(ar.info)p.scrollIntoView({behavior:'smooth',block:'nearest'})},
  arReset(){route()},
  arSlide(el){if(ar.stage!=='live'){el.value=0;return}ar.auto=false;arSetYaw(Number(el.value))},
  pickSample(el){stopAudio(true);bs.sample=el.dataset.k;bs.stage='idle';bs.motif=null;bs.text=false;refreshBs()},
  bsScan(){
    stopAudio(true);bs.stage='scan';bs.text=false;refreshBs();
    bs.timer=setTimeout(()=>{bs.stage='result';bs.motif=bs.sample;state.lastMotif=bs.sample;refreshBs();toast('Motif cocok dengan katalog')},1900);
  },
  manualPick(el){stopAudio(true);bs.motif=el.value;state.lastMotif=el.value;bs.text=false;refreshBs();toast('Motif diubah manual ke '+cardBy(el.value).name)},
  audio(){bs.playing?stopAudio():playAudio()},
  toggleText(){bs.text=!bs.text;const y=window.scrollY;refreshBs();window.scrollTo(0,y)},
  history(){
    const m=cardBy(bs.motif);const h=HIST[m.slug]||[];
    openModal(`<h2 style="font-family:var(--serif);font-size:1.7rem">Sejarah ${esc(m.name)}</h2><p class="muted" style="margin-top:6px;font-size:.9rem">Bersumber dari kartu yang sudah ditelaah.</p><ul class="tl">${h.map(([a,b])=>`<li><b>${esc(a)}</b>${esc(b)}</li>`).join('')}</ul>`,'sheet');
  },
  filter(el){state.filter=el.dataset.k;$('#view').innerHTML=pages['kartu']()},
  chip(el){sendChat(el.dataset.q)},
  send(){const i=$('#cin');sendChat(i.value);i.value='';i.focus()},
  approve(el){
    const c=cardBy(el.dataset.id);c.status='verified';c.date=TODAY;c.reviewer=(c.reviewer&&c.reviewer!=='Belum ada penelaah')?c.reviewer:'Kurator sesi ini';delete c.revisionNote;
    state.log.unshift({t:TODAY,m:c.name+' disetujui.'});
    $('#view').innerHTML=pages['kurator']();toast(c.name+' kini terverifikasi');
  },
  reqRev(el){const f=$('#rf-'+el.dataset.id);f.classList.toggle('open');if(f.classList.contains('open'))$('#rn-'+el.dataset.id).focus()},
  sendRev(el){
    const c=cardBy(el.dataset.id),v=($('#rn-'+c.id).value||'').trim();
    if(!v){toast('Tulis dulu catatan revisinya.');return}
    c.status='revision';c.revisionNote=v;c.date=TODAY;
    state.log.unshift({t:TODAY,m:`${c.name} dikembalikan: ${v}`});
    $('#view').innerHTML=pages['kurator']();toast('Catatan revisi terkirim');
  }
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='SELECT'||el.type==='range')return;const f=act[el.dataset.act];if(f){f(el,e)}});
document.addEventListener('change',e=>{const el=e.target.closest('select[data-act]');if(el)act[el.dataset.act](el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('input[type=range][data-act]');if(el)act[el.dataset.act](el,e)});

/* ============ start ============ */
route();
setTimeout(()=>{$('#splash').classList.add('off');document.body.classList.add('go')},1500);
setTimeout(()=>$('#splash').remove(),2200);
</script>
</body>
</html>
